# @package _global_

defaults:
  - override /train: h-edsr_unet_as
  - _self_

project : "pred_sera"
run_version: test_height_map

ckpt_path : ${data_dir}/logs/train_sera/${run_name}/vx_${run_name}/best_checkpoints/epoch_xxx.ckpt
load_just_weights: True

save_dir: ${log_dir}/predictions

datamodule:
  dataset:
    predict_dataset: 
      get_inputs: 
        open_even_oob: True
      stage: predict_test_subdivide
  instance:
    batch_size: 8

module:
  instance:
    train_metrics: null
    val_metrics: null 
    test_metrics: null
    predictions_save_dir : ${save_dir}
    