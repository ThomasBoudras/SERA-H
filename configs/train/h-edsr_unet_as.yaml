# @package _global_

defaults:
    - override /module/regression_model: unet
    - override /datamodule/dataset/get_inputs: s1_s2_composites
    - override /callbacks/image_type: s1_s2_composites

project: "train_sera"
run_name: h-edsr_unet_as
run_version: vx_${run_name}
ckpt_path: last

module:
    super_resolution_model:
        input_type: COMPOSITES

datamodule:
    instance:
        batch_size: 8
    dataset:
        patch_size_input: 32
        patch_size_target: 128
        gdf_path: ${data_dir}/sentinel/composites/height_map/gdf_height_map_composites.geojson

