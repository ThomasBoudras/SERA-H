# @package _global_

model: h-figure_gaps_and_edges

min_height: 0
max_height: 50
resolution: 2.5
nb_jobs: 10
seed: 12345
date_column: lidar_acquisition_date
print_config: True

tree_threshold: 2
edge_tolerance: 5.0  # in meters
gap_iou_threshold: 0.25

bins_area: [25, 50, 100, 500, 1000]
bins_labels: ["25-49", "50-99", "100-499", "500-999"]

data_dir: data
save_dir: ${data_dir}/logs/metrics/height_map/${model}
grouping_dates: lidar_acquisition_date
version_prediction: test_height_map
version_metrics: test_height_map

geometries_path: ${data_dir}/sentinel/timeseries/height_map/gdf_height_map_timeseries.geojson

hydra:
  run:
    dir: ${save_dir}
  output_subdir: hydra_logs

get_images:
  _target_: src.postprocessing.metrics.get_images_utils.get_images
  image_loaded_set:
    height_ref:
      _target_: src.postprocessing.metrics.get_images_utils.output_image_loader
      path: ${data_dir}/open_canopy/<year>/lidar.vrt
      resolution: ${resolution}
      resampling_method: max
      scaling_factor: 0.1
      min_image: ${min_height}
      max_image: ${max_height}
      open_even_oob: False
      max_date: null
      min_date: null
      grouping_dates: ${grouping_dates}

    # sera-h-max
    height_pred_sera:
      _target_: src.postprocessing.metrics.get_images_utils.output_image_loader
      path: ${data_dir}/logs/pred_sera/h-sera_h_max/${version_prediction}/predictions/data/h-sera_h_max_full.vrt
      resolution: ${resolution}
      resampling_method: max
      scaling_factor: 1
      min_image: ${min_height}
      max_image: ${max_height}
      open_even_oob: False
      max_date: null
      min_date: null
      grouping_dates: ${grouping_dates}

    # edsr-utae-scale-1
    height_pred_sera_h_scale_1:
      _target_: src.postprocessing.metrics.get_images_utils.output_image_loader
      path: ${data_dir}/logs/pred_sera/h-sera_h_scale_1/${version_prediction}/predictions/data/h-sera_h_scale_1_full.vrt
      resolution: ${resolution}
      resampling_method: bilinear
      scaling_factor: 1
      min_image: ${min_height}
      max_image: ${max_height}
      open_even_oob: False
      max_date: null
      min_date: null
      grouping_dates: ${grouping_dates}

    # utae-boosted
    height_pred_utae_boosted:
      _target_: src.postprocessing.metrics.get_images_utils.output_image_loader
      path: ${data_dir}/logs/pred_sera/h-utae_boosted/${version_prediction}/predictions/data/h-utae_boosted_full.vrt
      resolution: ${resolution}
      resampling_method: bilinear
      scaling_factor: 1
      min_image: ${min_height}
      max_image: ${max_height}
      open_even_oob: False
      max_date: null
      min_date: null
      grouping_dates: ${grouping_dates}

    # edsr-unet
    height_pred_edsr_unet:
      _target_: src.postprocessing.metrics.get_images_utils.output_image_loader
      path: ${data_dir}/logs/pred_sera/h-edsr_unet/${version_prediction}/predictions/data/h-edsr_unet_full.vrt
      resolution: ${resolution}
      resampling_method: bilinear
      scaling_factor: 1
      min_image: ${min_height}
      max_image: ${max_height}
      open_even_oob: False
      max_date: null
      min_date: null
      grouping_dates: ${grouping_dates}

  image_computed_set:
    canopy_gap_mask_ref:
      _target_: src.postprocessing.metrics.get_images_utils.min_max_height_mask_computer
      name_image: height_ref
      min_height: null
      max_height: ${tree_threshold}

    forest_mask_ref:
      _target_: src.postprocessing.metrics.get_images_utils.min_max_height_mask_computer
      name_image: height_ref
      min_height: ${tree_threshold}
      max_height: null

    # --- sera-h-max ---
    canopy_gap_mask_pred_sera:
      _target_: src.postprocessing.metrics.get_images_utils.min_max_height_mask_computer
      name_image: height_pred_sera
      min_height: null
      max_height: ${tree_threshold}

    forest_mask_pred_sera:
      _target_: src.postprocessing.metrics.get_images_utils.min_max_height_mask_computer
      name_image: height_pred_sera
      min_height: ${tree_threshold}
      max_height: null

    edge_mask_pred_sera:
      _target_: src.postprocessing.metrics.get_images_utils.detection_edge_mask_computer
      name_pred: forest_mask_pred_sera
      name_ref: forest_mask_ref
      tolerance: ${edge_tolerance}
      resolution: ${resolution}

    binned_canopy_gap_mask_pred_sera:
      _target_: src.postprocessing.metrics.get_images_utils.binned_by_object_scale_mask_computer
      name_pred: canopy_gap_mask_pred_sera
      name_ref: canopy_gap_mask_ref
      bins_range_area: ${bins_area}
      resolution: ${resolution}
      iou_threshold: ${gap_iou_threshold}
      reduction_basis: "pred"
      include_outer_bins: False
      apply_erosion_dilation: False

    binned_canopy_gap_mask_ref_sera:
      _target_: src.postprocessing.metrics.get_images_utils.binned_by_object_scale_mask_computer
      name_pred: canopy_gap_mask_pred_sera
      name_ref: canopy_gap_mask_ref
      bins_range_area: ${bins_area}
      resolution: ${resolution}
      iou_threshold: ${gap_iou_threshold}
      reduction_basis: "ref"
      include_outer_bins: False
      apply_erosion_dilation: False

    # --- edsr-utae-scale-1 ---
    canopy_gap_mask_pred_sera_h_scale_1:
      _target_: src.postprocessing.metrics.get_images_utils.min_max_height_mask_computer
      name_image: height_pred_sera_h_scale_1
      min_height: null
      max_height: ${tree_threshold}

    forest_mask_pred_sera_h_scale_1:
      _target_: src.postprocessing.metrics.get_images_utils.min_max_height_mask_computer
      name_image: height_pred_sera_h_scale_1
      min_height: ${tree_threshold}
      max_height: null

    binned_canopy_gap_mask_pred_sera_h_scale_1:
      _target_: src.postprocessing.metrics.get_images_utils.binned_by_object_scale_mask_computer
      name_pred: canopy_gap_mask_pred_sera_h_scale_1
      name_ref: canopy_gap_mask_ref
      bins_range_area: ${bins_area}
      resolution: ${resolution}
      iou_threshold: ${gap_iou_threshold}
      reduction_basis: "pred"
      include_outer_bins: False
      apply_erosion_dilation: False

    binned_canopy_gap_mask_ref_sera_h_scale_1:
      _target_: src.postprocessing.metrics.get_images_utils.binned_by_object_scale_mask_computer
      name_pred: canopy_gap_mask_pred_sera_h_scale_1
      name_ref: canopy_gap_mask_ref
      bins_range_area: ${bins_area}
      resolution: ${resolution}
      iou_threshold: ${gap_iou_threshold}
      reduction_basis: "ref"
      include_outer_bins: False
      apply_erosion_dilation: False

    # --- utae-boosted ---
    canopy_gap_mask_pred_utae_boosted:
      _target_: src.postprocessing.metrics.get_images_utils.min_max_height_mask_computer
      name_image: height_pred_utae_boosted
      min_height: null
      max_height: ${tree_threshold}

    forest_mask_pred_utae_boosted:
      _target_: src.postprocessing.metrics.get_images_utils.min_max_height_mask_computer
      name_image: height_pred_utae_boosted
      min_height: ${tree_threshold}
      max_height: null


    binned_canopy_gap_mask_pred_utae_boosted:
