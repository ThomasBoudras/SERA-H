root_dir: data/
data_dir: ${root_dir}/sentinel/timeseries/height_map_test_2019

create_vrts: src.preprocessing.datasets.get_clean_dataset_utils.create_vrts_timeseries
get_valid_vrts: src.preprocessing.datasets.get_clean_dataset_utils.get_valid_vrts_timeseries

n_jobs_parrallelized: -1

via_bounds: null
via_geojson:
  path: ${root_dir}/utils/gdf_height_map_initial_test_2019.geojson

grouping_dates_column: lidar_acquisition_date
validation_column: valid_vrts
gdf_clean_path: ${data_dir}/gdf_height_map_timeseries_test_2019.geojson
gdf_unclean_path: ${data_dir}/gdf_height_map_timeseries_test_2019_unsaved.geojson
half_window_size: 60

hydra:
  run :
    dir : ${data_dir}/logs
  output_subdir : hydra_logs